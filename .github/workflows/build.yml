name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testMobileDebugUnitTest
      - name: Build release APKs
        run: ./gradlew assembleTvRelease assembleMobileRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tormeo-tv-armeabi-v7a
          path: app/build/outputs/apk/tv/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tormeo-mobile
          path: app/build/outputs/apk/mobile/release/*.apk
