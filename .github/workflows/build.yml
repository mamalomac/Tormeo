name: Build APK

on:
  push:
    branches: ['**']
  release:
    types: [published]   # publishing a release in the GitHub UI builds and attaches the APKs
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the release with APKs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew testMobileDebugUnitTest
      - name: Build release APKs
        run: ./gradlew assembleTvRelease assembleMobileRelease
      - name: Rename APKs
        run: |
          VER="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          # Fixed names so https://github.com/<owner>/<repo>/releases/latest/download/Tormeo-TV.apk always works
          cp app/build/outputs/apk/tv/release/*.apk dist/Tormeo-TV.apk
          cp app/build/outputs/apk/mobile/release/*.apk dist/Tormeo-Mobile.apk
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: tormeo-apks
          path: dist/*.apk
      - name: Publish GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            **Tormeo-TV.apk** – Android TV (armeabi-v7a) / TV boksovi (Android 6.0+)
            **Tormeo-Mobile.apk** – telefoni i tableti (Android 6.0+)
