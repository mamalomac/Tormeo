name: Build APK

on:
  push:
    branches: ['**']
  release:
    types: [published]   # publishing a release in the GitHub UI builds and attaches the APKs
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the release with APKs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testMobileDebugUnitTest
      - name: Build release APKs
        run: ./gradlew assembleTvRelease assembleMobileRelease
      - name: Rename APKs
        run: |
          VER="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          cp app/build/outputs/apk/tv/release/*.apk "dist/Tormeo-TV-armeabi-v7a-$VER.apk"
          cp app/build/outputs/apk/mobile/release/*.apk "dist/Tormeo-Mobile-$VER.apk"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: tormeo-apks
          path: dist/*.apk
      - name: Publish GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            **Tormeo-TV-armeabi-v7a** – Android TV / TV boksovi (Android 6.0+)
            **Tormeo-Mobile** – telefoni i tableti (Android 6.0+)
